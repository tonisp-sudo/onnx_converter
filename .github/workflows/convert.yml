name: Compile reCamera Model

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Sophgo Compiler Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace sophgo/tpuc_dev:latest /bin/bash -c "
            cd /workspace &&
            model_transform \
              --model_name yolov11n_face \
              --model_def model.onnx \
              --input_shapes '[[1,3,640,640]]' \
              --mean '0.0,0.0,0.0' \
              --scale '0.0039216,0.0039216,0.0039216' \
              --keep_aspect_ratio \
              --pixel_format rgb \
              --mlir yolov11n_face.mlir &&
            model_deploy.py \
              --mlir yolov11n_face.mlir \
              --quantize F32 \
              --chip sg200x \
              --model yolov11n_face.cvimodel
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recamera-model
          path: yolov11n_face.cvimodel
